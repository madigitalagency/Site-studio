# studio.madigitalagency.net — nginx dans le conteneur, derrière Traefik (TLS, certificat).
# Source unique des en-têtes de sécurité (CDC v3 §4.1). Le site n'a aucun code en ligne : la CSP est stricte.
# /srv = /opt/studio sur l'hôte : current -> releases/<date> (pages), media/ (vidéos et images, hors versions).

# Le formulaire part vers le webhook n8n. À_CONFIRMER : même cible que le site principal (nom de service sur le réseau Traefik
# ou URL publique). Par défaut : le conteneur n8n sur le réseau partagé.
upstream n8n_studio { server root-n8n-1:5678; }   # À_CONFIRMER

limit_req_zone $binary_remote_addr zone=contact:1m rate=3r/m;

map $sent_http_content_type $cache_regle {
  default                       "public, max-age=3600";
  ~text/html                    "no-cache";
  ~application/xml              "no-cache";
  ~text/plain                   "no-cache";
}

server {
  listen 80;
  server_name studio.madigitalagency.net;
  root /srv/current;
  index index.html;
  charset utf-8;

  # Types absents de la liste par défaut
  types { application/manifest+json webmanifest; }
  include /etc/nginx/mime.types;

  # En-têtes de sécurité (always : aussi sur les erreurs)
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Cache-Control $cache_regle always;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;
  gzip_min_length 1024;

  # Ressources empreintées par Astro : immuables
  location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }
  location /fonts/  { add_header Cache-Control "public, max-age=31536000, immutable" always; try_files $uri =404; }

  # Médias : hors des versions, servis avec lecture partielle (vidéo) et cache long
  location /media/ {
    alias /srv/media/;
    add_header Cache-Control "public, max-age=2592000" always;
    add_header Accept-Ranges bytes always;
    try_files $uri =404;
  }

  # Formulaire de contact : relais vers n8n (webhook studio-contact), 3 envois par minute et par adresse
  location = /api/contact {
    limit_req zone=contact burst=3 nodelay;
    limit_except POST { deny all; }
    client_max_body_size 32k;
    proxy_pass http://n8n_studio/webhook/studio-contact;   # À_CONFIRMER : chemin du webhook importé
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 15s;
    proxy_intercept_errors on;
    error_page 502 503 504 = @formulaire_indisponible;
  }
  location @formulaire_indisponible { return 503; }

  # Pages : /chemin/ -> /chemin/index.html ; 404 du site
  location / {
    try_files $uri $uri/index.html =404;
  }
  error_page 404 /404.html;
  location = /404.html { internal; }

  # Pas de listing, pas de fichiers cachés
  autoindex off;
  location ~ /\. { deny all; }
}
