# studio.madigitalagency.net — nginx dans le conteneur, derrière Traefik (TLS, certificat, redirection HTTPS).
# Source unique des en-têtes de sécurité (CDC v3 §4.1). Le site n'a aucun code en ligne : la CSP est stricte.
# /srv = /opt/studio sur l'hôte : current -> releases/<date> (pages), media/ (vidéos et images, hors versions).
#
# Règle nginx : un add_header dans un bloc location annule TOUS ceux du bloc server. Les en-têtes ne sont donc posés
# qu'ici, au niveau server, et le cache varie par des variables (map) plutôt que par des add_header par location.

limit_req_zone $binary_remote_addr zone=contact:1m rate=3r/m;

# Cache par chemin (ressources empreintées, polices, médias), sinon par type
map $uri $cache_chemin {
  ~^/(_astro|fonts)/   "public, max-age=31536000, immutable";
  ~^/media/            "public, max-age=2592000";
  default              "";
}
map $sent_http_content_type $cache_type {
  ~text/html           "no-cache";
  ~xml                 "no-cache";
  ~text/plain          "no-cache";
  default              "public, max-age=3600";
}
map $cache_chemin $cache_regle {
  ""                   $cache_type;
  default              $cache_chemin;
}

server {
  listen 80;
  listen [::]:80;
  server_name studio.madigitalagency.net;
  root /srv/current;
  index index.html;
  charset utf-8;
  server_tokens off;
  autoindex off;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cache-Control $cache_regle always;

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml application/manifest+json;

  # Médias : hors des versions (lecture partielle des vidéos gérée nativement par nginx)
  location /media/ {
    alias /srv/media/;
    try_files $uri =404;
  }

  location = /site.webmanifest { default_type application/manifest+json; }

  # Formulaire : relais vers n8n, même méthode que le site principal (nom de service Docker résolu à la demande,
  # nginx démarre même si n8n est arrêté). 3 envois par minute et par adresse.
  location = /api/contact {
    limit_except POST { deny all; }
    limit_req zone=contact burst=3 nodelay;
    client_max_body_size 32k;
    resolver 127.0.0.11 valid=30s;
    set $n8n_upstream http://n8n:5678;
    proxy_pass $n8n_upstream/webhook/studio-contact;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_connect_timeout 10s;
    proxy_read_timeout 30s;
  }

  location / {
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html { internal; }

  location ~ /\. { deny all; }
}
