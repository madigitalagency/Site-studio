# Protection de l'éditeur n8n (reste ouvert de l'audit du 06/10). Réglages relevés le 11/10.
# Aujourd'hui, https://n8n.srv1170093.hstgr.cloud ouvre l'éditeur à tout Internet (seul le compte n8n protège).
# Les deux formulaires (site principal et Studio) passent par le réseau Docker interne (http://n8n:5678),
# pas par Traefik : ils ne sont pas touchés par cette protection.
#
# Ce bloc remplace les labels du service n8n dans /root/docker-compose.yml (lignes « labels: » jusqu'à « environment: »).
# Avant : cp /root/docker-compose.yml /root/docker-compose.yml.avant-protection
# Mot de passe : sur le VPS, `openssl passwd -apr1` (le demande deux fois, affiche l'empreinte $apr1$...).
# Dans le label, chaque « $ » de l'empreinte s'écrit « $$ ».
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      # Middleware d'origine (en-têtes), inchangé
      - traefik.http.middlewares.n8n.headers.SSLRedirect=true
      - traefik.http.middlewares.n8n.headers.STSSeconds=315360000
      - traefik.http.middlewares.n8n.headers.browserXSSFilter=true
      - traefik.http.middlewares.n8n.headers.contentTypeNosniff=true
      - traefik.http.middlewares.n8n.headers.forceSTSHeader=true
      - traefik.http.middlewares.n8n.headers.SSLHost=${DOMAIN_NAME}
      - traefik.http.middlewares.n8n.headers.STSIncludeSubdomains=true
      - traefik.http.middlewares.n8n.headers.STSPreload=true
      # Nouveau : authentification devant l'éditeur
      - traefik.http.middlewares.n8n-auth.basicauth.users=mourad:$$apr1$$REMPLACER$$REMPLACER
      - traefik.http.middlewares.n8n-auth.basicauth.realm=n8n
      # Webhooks publics : sans authentification (au cas où un service extérieur les appelle)
      - traefik.http.routers.n8n-webhook.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`) && (PathPrefix(`/webhook/`) || PathPrefix(`/webhook-waiting/`) || PathPrefix(`/form/`))
      - traefik.http.routers.n8n-webhook.entrypoints=web,websecure
      - traefik.http.routers.n8n-webhook.tls=true
      - traefik.http.routers.n8n-webhook.tls.certresolver=mytlschallenge
      - traefik.http.routers.n8n-webhook.priority=100
      - traefik.http.routers.n8n-webhook.middlewares=n8n@docker
      - traefik.http.routers.n8n-webhook.service=n8n
      # Éditeur et API : en-têtes + authentification
      - traefik.http.routers.n8n.rule=Host(`${SUBDOMAIN}.${DOMAIN_NAME}`)
      - traefik.http.routers.n8n.entrypoints=web,websecure
      - traefik.http.routers.n8n.tls=true
      - traefik.http.routers.n8n.tls.certresolver=mytlschallenge
      - traefik.http.routers.n8n.priority=10
      - traefik.http.routers.n8n.middlewares=n8n@docker,n8n-auth@docker
      - traefik.http.routers.n8n.service=n8n
      - traefik.http.services.n8n.loadbalancer.server.port=5678
# Puis : cd /root && docker compose up -d n8n
# Vérifier depuis le PC :
#   curl -sI https://n8n.srv1170093.hstgr.cloud/ | head -1                 -> HTTP/1.1 401
#   curl -sI https://n8n.srv1170093.hstgr.cloud/webhook/inexistant | head -1  -> 404 (joignable, sans mot de passe)
# Retour arrière : cp /root/docker-compose.yml.avant-protection /root/docker-compose.yml && docker compose up -d n8n
