# Site Studio : un conteneur nginx:alpine derrière Traefik, sur le modèle exact du site principal (/opt/madigitalagency).
# Dossier serveur : /opt/studio (ce fichier, nginx.conf, release.sh, releases/, current -> releases/<date>, media/)
# Réglages relevés le 11/10 (lecture-lot6) : réseau root_default, résolveur mytlschallenge, points d'entrée web,websecure
# (la redirection HTTP -> HTTPS est déjà faite par Traefik pour tout le serveur).
services:
  studio:
    image: nginx:alpine
    container_name: studio
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/srv:ro
    networks:
      - root_default
    labels:
      - traefik.enable=true
      - traefik.docker.network=root_default
      - traefik.http.routers.studio-web.rule=Host(`studio.madigitalagency.net`)
      - traefik.http.routers.studio-web.entrypoints=web,websecure
      - traefik.http.routers.studio-web.tls=true
      - traefik.http.routers.studio-web.tls.certresolver=mytlschallenge
      - traefik.http.services.studio-web.loadbalancer.server.port=80

networks:
  root_default:
    external: true
